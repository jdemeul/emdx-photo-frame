services:
  photo-frame:
    build: .
    image: emdx-photo-frame:latest
    container_name: emdx-photo-frame
    # Host networking: the display downloads each image from this container's
    # web server, and Wake-on-LAN broadcasts must reach the LAN.
    network_mode: host
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      # State, the current image and previews. A Docker volume rather than a folder in
      # the project, so replacing or re-copying the project folder doesn't wipe it.
      - frame-data:/data
      # Optional extra source: a folder of photos on the NAS (then set PHOTO_DIR=/photos)
      # - /volume1/photo/frame:/photos:ro

volumes:
  frame-data:
